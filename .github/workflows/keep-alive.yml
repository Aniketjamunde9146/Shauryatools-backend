# Backup keep-alive: pings the backend from outside every 10 minutes (free on GitHub).
# Setup: repo Settings > Secrets and variables > Actions > New repository secret
#   Name: BACKEND_URL    Value: https://your-backend.onrender.com   (no trailing slash)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 "${{ secrets.BACKEND_URL }}/health"
